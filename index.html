<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CB29 Economy">
<meta name="theme-color" content="#0D1014">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230D1014'/%3E%3Ctext x='90' y='116' font-family='Helvetica,Arial' font-size='62' font-weight='bold' fill='%23E3A84A' text-anchor='middle'%3ECB%3C/text%3E%3C/svg%3E">
</head>
<body>
<title>CB29 Economy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0D1014; --bg-2:#12161C; --surf:#171C23; --surf-2:#1D232B;
  --line:#262D37; --line-2:#333C48;
  --tx:#E8EBF0; --tx-2:#9AA3B2; --tx-3:#6B7484;
  --acc:#E3A84A; --acc-dim:#4A3A1C;
  --pos:#46C98B; --neg:#F2705E; --play:#C77DFF;
  --r:14px; --r-sm:10px;
  --ff-d:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --ff-b:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --ff-m:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff-b);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--ff-m);font-variant-numeric:tabular-nums}

#app{max-width:460px;margin:0 auto;padding:env(safe-area-inset-top) 16px 108px;min-height:100vh}

/* ---------- header ---------- */
.hdr{padding:26px 0 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hdr-l{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3);font-weight:600}
.hdr h1{font-family:var(--ff-d);font-size:19px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surf);
  display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:active{background:var(--surf-2)}

/* ---------- net ---------- */
.net{background:linear-gradient(158deg,var(--surf) 0%,var(--bg-2) 100%);border:1px solid var(--line);
  border-radius:20px;padding:20px;margin-top:6px}
.net .lab{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3);font-weight:600}
.net .big{font-family:var(--ff-d);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px;
  font-variant-numeric:tabular-nums}
.net .sub{font-size:12.5px;color:var(--tx-2);margin-top:6px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px}
.chip b{display:block;font-family:var(--ff-m);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.chip span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx-3);font-weight:600}

/* ---------- generic ---------- */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:10px}
.sec-h h2{font-family:var(--ff-d);font-size:14px;font-weight:700;letter-spacing:.02em;margin:0}
.sec-h .link{font-size:12.5px;color:var(--acc);cursor:pointer;background:none;border:0;padding:0;font-weight:500}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:9px}
.tile{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;cursor:pointer}
.tile:active{background:var(--surf-2)}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tile-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3);font-weight:600}
.tile-v{font-family:var(--ff-d);font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:5px;
  font-variant-numeric:tabular-nums}
.tile-s{font-size:12.5px;color:var(--tx-2);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .acc{color:var(--acc)} .mut{color:var(--tx-2)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--tx-2);white-space:nowrap}
.pill.ok{color:var(--pos);border-color:rgba(70,201,139,.4);background:rgba(70,201,139,.09)}
.pill.wait{color:var(--acc);border-color:rgba(227,168,74,.4);background:rgba(227,168,74,.09)}
.pill.off{color:var(--tx-3)}
.pill.play{color:var(--play);border-color:rgba(199,125,255,.4);background:rgba(199,125,255,.09)}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row-i{width:34px;height:34px;border-radius:10px;background:var(--surf-2);display:grid;place-items:center;flex:none;
  font-family:var(--ff-d);font-size:13px;font-weight:800;color:var(--tx-2)}
.row-m{flex:1;min-width:0}
.row-m b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m span{font-size:12px;color:var(--tx-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row-a{font-family:var(--ff-m);font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:26px 14px;text-align:center;color:var(--tx-3);font-size:13.5px;line-height:1.6}

/* ---------- bars ---------- */
.bar{height:6px;border-radius:99px;background:var(--surf-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .35s ease}
.bar i.done{background:var(--pos)}

/* ---------- tabbar + fab ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(13,16,20,.93);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 0 max(9px,env(safe-area-inset-bottom))}
.tabbar-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--tx-3);cursor:pointer;font-size:10px;font-weight:600;letter-spacing:.02em}
.tab.on{color:var(--acc)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:41;right:calc(50% - 230px + 16px);bottom:calc(74px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:18px;border:0;background:var(--acc);color:#171106;
  font-size:30px;font-weight:400;line-height:1;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 10px 26px rgba(0,0,0,.5)}
.fab:active{transform:scale(.94)}
@media(max-width:492px){.fab{right:16px}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--bg-2);border-top:1px solid var(--line-2);border-radius:22px 22px 0 0;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheet-in{max-width:460px;margin:0 auto;padding:8px 16px calc(26px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 14px}
.sheet h3{font-family:var(--ff-d);font-size:19px;font-weight:800;margin:0 0 3px;letter-spacing:-.01em}
.sheet .hint{font-size:13px;color:var(--tx-2);margin:0 0 16px}

/* ---------- forms ---------- */
.f{display:flex;flex-direction:column;gap:13px}
.fl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);font-weight:600;
  display:block;margin-bottom:6px}
.fi{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 13px;font-size:16px;outline:none}
.fi:focus{border-color:var(--acc)}
select.fi{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx-3) 50%),linear-gradient(135deg,var(--tx-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seg{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px}
.seg button{flex:1;padding:9px 4px;border:0;background:none;border-radius:7px;font-size:13.5px;font-weight:600;
  color:var(--tx-2);cursor:pointer}
.seg button.on{background:var(--surf-2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.btn{width:100%;padding:15px;border:0;border-radius:13px;background:var(--acc);color:#171106;
  font-weight:700;font-size:15.5px;cursor:pointer;font-family:var(--ff-d);letter-spacing:.01em}
.btn:active{opacity:.85}
.btn.ghost{background:var(--surf);color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.danger{background:none;color:var(--neg);border:1px solid rgba(242,112,94,.35)}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:13px;cursor:pointer;margin-bottom:8px}
.act:active{background:var(--surf-2)}
.act i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-style:normal;
  font-family:var(--ff-d);font-weight:800;font-size:15px}
.act b{display:block;font-size:14.5px;font-weight:600}
.act span{font-size:12px;color:var(--tx-3)}
.err{color:var(--neg);font-size:13px;margin:0}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%) translateY(20px);bottom:96px;
  background:var(--surf-2);border:1px solid var(--line-2);color:var(--tx);padding:11px 17px;border-radius:12px;
  font-size:13.5px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modalwrap{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:24px;
  background:rgba(0,0,0,.66)}
.modalwrap.on{display:grid}
.modalbox{background:var(--bg-2);border:1px solid var(--line-2);border-radius:18px;padding:20px;
  max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.modalbox p{margin:0 0 18px;font-size:14.5px;line-height:1.5}
.modalbox b{font-family:var(--ff-d);font-size:17px;display:block;margin-bottom:7px}
.modalrow{display:flex;gap:9px}
.modalrow .btn{padding:12px}
.itemrow{display:grid;grid-template-columns:1fr 74px 34px;gap:7px;align-items:center}
.itemrow .fi{padding:10px;font-size:14.5px}
.mini{background:none;border:1px solid var(--line);border-radius:9px;color:var(--tx-3);cursor:pointer;
  height:41px;display:grid;place-items:center;font-size:18px}
.note{background:rgba(227,168,74,.07);border:1px solid rgba(227,168,74,.25);border-radius:var(--r-sm);
  padding:11px 13px;font-size:12.5px;color:#EBC48A;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--tx-2)}
.kv b{font-family:var(--ff-m);font-weight:600;font-variant-numeric:tabular-nums}
textarea.fi{min-height:130px;font-family:var(--ff-m);font-size:12px;line-height:1.5;resize:vertical}
h4.sub{font-family:var(--ff-d);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx-3);margin:20px 0 9px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div class="fab" id="fab" role="button" tabindex="0" aria-label="Aggiungi">+</div>
<nav class="tabbar"><div class="tabbar-in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<div class="modalwrap" id="ask"><div class="modalbox" id="askBox"></div></div>

<script>
"use strict";
/* ============================ STATO ============================ */
var KEY="cb29economy.v1";
var TOKEN_EUR=30/7600; /* 7600 isytoken = 30 € */
var CATS=["Vestiti","Fornitori cinesi","Casa","Regali","Cura personale","Cibo","Abbonamenti","Altro"];
var CATS_IN=["Vendita","Promo","Regalo","Paghetta","Rimborso","Altro"];
var blank={v:1,ledger:[],orders:[],sales:[],promos:[],play:[],debts:[],bk:0};
var S=load();

function load(){
  try{var r=localStorage.getItem(KEY);
    if(!r){var legacy=localStorage.getItem("soldicamera.v1");
      if(legacy){localStorage.setItem(KEY,legacy);r=legacy;}}
    if(!r)return JSON.parse(JSON.stringify(blank));
    var d=JSON.parse(r);for(var k in blank)if(!(k in d))d[k]=Array.isArray(blank[k])?[]:blank[k];
    ["ledger","orders","sales","promos","play","debts"].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
    d.orders.forEach(function(o){
      if(!Array.isArray(o.items))o.items=[];
      if(o.total===undefined||o.total===null){
        var g=0;o.items.forEach(function(i){g+=(i.qty||0)*(i.price||0);});
        o.total=g+(parseFloat(o.ship1)||0);
      }
      o.items.forEach(function(i){i.qty=Math.round(i.qty)||0;});
    });
    d.sales=d.sales.filter(function(x){
      var o=null,i;for(i=0;i<d.orders.length;i++)if(d.orders[i].id===x.oid)o=d.orders[i];
      if(!o)return false;
      for(i=0;i<o.items.length;i++)if(o.items[i].id===x.iid)return true;
      return false;});
    return d;}
  catch(e){return JSON.parse(JSON.stringify(blank));}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Spazio esaurito: fai un backup");}}
function records(){return S.ledger.length+S.orders.length+S.sales.length+S.promos.length+S.play.length+S.debts.length;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ============================ UTIL ============================ */
function num(x){
  if(typeof x==="number")return x;
  var s=String(x||"").replace(/[^0-9.,-]/g,"").trim();
  if(!s)return 0;
  if(s.indexOf(",")>-1&&s.indexOf(".")>-1)s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  else s=s.replace(",",".");
  var n=parseFloat(s);return isNaN(n)?0:n;
}
function eur(n,sign){
  var s=(Math.abs(n)).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
  var p=n<0?"-":(sign&&n>0?"+":"");
  return p+s+" €";
}
function eur0(n){return Math.round(n).toLocaleString("it-IT")+" €";}
function today(){var d=new Date();return d.toISOString().slice(0,10);}
function dmy(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1];}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function monthOf(s){return (s||"").slice(0,7);}
function curMonth(){return today().slice(0,7);}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove("on");},2100);}

/* ============================ LEDGER ============================ */
/* ogni evento che muove soldi veri scrive qui */
function post(wallet,amount,label,kind,ref,date,cat){
  S.ledger.push({id:uid(),w:wallet,a:amount,l:label,k:kind,ref:ref||null,d:date||today(),c:cat||""});
}
function unpost(ref){S.ledger=S.ledger.filter(function(e){return e.ref!==ref;});}
function balance(w){return S.ledger.reduce(function(t,e){return e.w===w?t+e.a:t;},0);}

/* ============================ BUSINESS ============================ */
function oPieces(o){return o.items.reduce(function(t,i){return t+i.qty;},0);}
function oPaid(o){return num(o.total);}                    /* tutto compreso fino al magazzino */
function oShip2(o){return o.ship2paid?num(o.ship2):0;}     /* spedizione per l'Italia */
function oCost(o){return oPaid(o)+oShip2(o);}
function oOpen(o){return !o.ship2paid;}
function unitCost(o,it){var p=oPieces(o);return p?oCost(o)/p:0;}
function soldQty(oid,iid){return S.sales.reduce(function(t,s){return (s.oid===oid&&s.iid===iid)?t+s.qty:t;},0);}
function leftQty(o,it){return Math.max(0,it.qty-soldQty(o.id,it.id));}
function oRevenue(oid){return S.sales.reduce(function(t,s){return s.oid===oid?t+s.price:t;},0);}
function stockValue(){
  return S.orders.reduce(function(t,o){
    return t+o.items.reduce(function(u,it){return u+leftQty(o,it)*unitCost(o,it);},0);
  },0);
}
function stockPieces(){
  return S.orders.reduce(function(t,o){
    return t+o.items.reduce(function(u,it){return u+leftQty(o,it);},0);},0);
}
function saleProfit(s){
  var o=find(S.orders,s.oid);if(!o)return 0;
  var it=find(o.items,s.iid);if(!it)return 0;
  return s.price-unitCost(o,it)*s.qty;
}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}

/* ============================ TOTALI ============================ */
function debtLeft(){return S.debts.reduce(function(t,d){return t+num(d.left);},0);}
function playBalance(){return S.play.reduce(function(t,p){return t+(p.kind==="prelievo"?p.amount:-p.amount);},0);}
function playMonth(){return S.play.reduce(function(t,p){
  return monthOf(p.date)===curMonth()?t+(p.kind==="prelievo"?p.amount:-p.amount):t;},0);}
function promoWaiting(){return S.promos.reduce(function(t,p){
  return (p.status==="accreditato"||p.status==="convertito")?t+num(p.value):t;},0);}
function promoTokens(){return S.promos.reduce(function(t,p){
  return p.status==="accreditato"?t+(num(p.tokens)||0):t;},0);}
function promoTotal(){return S.promos.reduce(function(t,p){
  return (p.status==="invitato"||p.status==="registrato")?t:t+num(p.value);},0);}
function monthInOut(m){
  var i=0,u=0,adj=0;
  S.ledger.forEach(function(e){
    if(monthOf(e.d)!==m)return;
    if(e.k==="giro")return;              /* spostare soldi non e ne entrata ne spesa */
    if(e.k==="rettifica"){adj+=e.a;return;}
    if(e.a>0)i+=e.a;else u+=e.a;
  });
  return {in:i,out:u,adj:adj};
}
function catBreakdown(m){
  var map={};
  S.ledger.forEach(function(e){
    if(monthOf(e.d)!==m||e.a>=0||e.k==="giro")return;
    var k=e.c||({ordine:"Ordini fornitore",spedizione:"Ordini fornitore",rata:"Rate e debiti",
      gioco:"Gioco",vendita:"Vendite",rettifica:"Correzioni"}[e.k]||"Altro");
    map[k]=(map[k]||0)+Math.abs(e.a);
  });
  return Object.keys(map).map(function(k){return {k:k,v:map[k]};}).sort(function(a,b){return b.v-a.v;});
}
function liquid(){return balance("contanti")+balance("conto");}      /* i soldi che hai davvero */
function netWorth(){return liquid()+stockValue()-debtLeft();}        /* quadro completo */
function profitMonth(){
  return S.sales.reduce(function(t,s){return monthOf(s.date)===curMonth()?t+saleProfit(s):t;},0);
}

  var el=document.getElementById("app");

function monthName(){
  var m=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  return m[new Date().getMonth()];
}
function chip(l,v){return '<div class="chip"><span>'+l+'</span><b class="'+(v<0?"neg":"")+'">'+eur(v)+'</b></div>';}
function byDateDesc(a,b){return (b.d||b.date||"").localeCompare(a.d||a.date||"")|| (b.id>a.id?1:-1);}
function ledRow(e){
  return '<div class="row" data-del-led="'+e.id+'"><div class="row-i">'+esc((e.k||"?").slice(0,1).toUpperCase())+'</div>'+
   '<div class="row-m"><b>'+esc(e.l)+'</b><span>'+dmy(e.d)+' · '+esc(e.w)+
     (e.c&&e.c!==e.l?' · '+esc(e.c):'')+'</span></div>'+
   '<div class="row-a '+(e.a<0?"neg":"pos")+'">'+eur(e.a,true)+'</div></div>';
}

  }

  L.forEach(function(e){var m=monthOf(e.d);(g[m]=g[m]||[]).push(e);});
  var keys=Object.keys(g).sort().reverse();
  if(!keys.length)h+='<div class="sec"><div class="card"><div class="empty">Nessun movimento.<br>Tocca <b>+</b> per iniziare.</div></div></div>';

    h+='<div class="sec"><div class="sec-h"><h2>'+labMonth(m)+'</h2>'+

        '<span class="mut">Uscite</span><b class="mono neg">'+eur(io.out)+'</b></div>'+
        (io.adj?'<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:5px">'+
          '<span class="mut">Correzioni di saldo</span><b class="mono '+(io.adj<0?"neg":"pos")+'">'+

  });

function labMonth(m){
  var mm=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
  var p=String(m||"").split("-"),i=parseInt(p[1],10);
  if(!mm[i-1]||!p[0])return "Senza data";
  return mm[i-1]+" "+p[0];
}

function vBiz(){
  var h=header("Acquisti e vendite","Business",true);
  var pm=profitMonth();
  var allProfit=S.sales.reduce(function(t,s){return t+saleProfit(s);},0);
  h+='<div class="net" style="border-radius:var(--r)"><div class="lab">Profitto totale</div>'+
     '<div class="big '+(allProfit>=0?"pos":"neg")+'" style="font-size:36px">'+eur(allProfit,true)+'</div>'+
     '<div class="chips">'+chip("Questo mese",pm)+chip("Magazzino",stockValue())+'</div></div>';

  h+='<div class="sec"><div class="sec-h"><h2>Ordini</h2>'+
     '<button class="link" data-sheet="order">+ Nuovo ordine</button></div>';
  if(!S.orders.length)h+='<div class="card"><div class="empty">Nessun ordine.<br>Registra il primo ordine dal fornitore.</div></div>';
  S.orders.slice().sort(byDateDesc).forEach(function(o){
    var cost=oCost(o),rev=oRevenue(o.id),p=oPieces(o),left=o.items.reduce(function(t,i){return t+leftQty(o,i);},0);
    var pct=cost>0?Math.min(100,rev/cost*100):0;
    h+='<div class="card" data-order="'+o.id+'" style="cursor:pointer">'+
      '<div class="tile-top"><b style="font-family:var(--ff-d);font-size:15.5px">'+esc(o.name)+'</b>'+
      (oOpen(o)?'<span class="pill wait">spedizione da pagare</span>':'<span class="pill ok">arrivato</span>')+'</div>'+
      '<div class="tile-s" style="margin-top:4px">'+dmy(o.date)+' · '+p+' pezzi · '+eur(cost)+
        ' ('+eur(p?cost/p:0)+' a pezzo'+(oOpen(o)?', provvisorio':'')+')</div>'+
      '<div class="bar"><i class="'+(pct>=100?"done":"")+'" style="width:'+pct.toFixed(0)+'%"></i></div>'+
      '<div class="tile-s" style="margin-top:7px">Rientrato '+eur(rev)+' su '+eur(cost)+' · '+
        (rev>=cost?'<span class="pos">tutto recuperato, il resto è guadagno</span>':
         '<span class="acc">mancano '+eur(cost-rev)+'</span>')+'</div>'+
      '<div class="tile-s">'+left+' pezzi ancora in magazzino</div></div>';
  });
  h+='</div>';

  var sales=S.sales.slice().sort(byDateDesc).slice(0,12);
  h+='<div class="sec"><div class="sec-h"><h2>Ultime vendite</h2>'+
     (stockPieces()?'<button class="link" data-sheet="sale">+ Vendita</button>':'')+'</div><div class="card">'+
     (sales.length?sales.map(function(s){
        var o=find(S.orders,s.oid),it=o?find(o.items,s.iid):null;
        return '<div class="row" data-del-sale="'+s.id+'"><div class="row-i">V</div><div class="row-m">'+
          '<b>'+esc(it?it.name:"articolo")+(s.qty>1?" ×"+s.qty:"")+'</b>'+
          '<span>'+dmy(s.date)+' · '+esc(s.channel)+(o?' · '+esc(o.name):'')+'</span></div>'+
          '<div class="row-a pos">'+eur(s.price,true)+'</div></div>';
      }).join(""):'<div class="empty">Nessuna vendita registrata.</div>')+'</div></div>';
  return h;
}

          '<div class="row-m"><b>'+esc(p.person)+'</b><span>'+dmy(p.date)+' · '+esc(p.type)+

          '<span class="pill '+cls+'">'+esc(p.status)+'</span></div></div>';

     '<input class="fi mono" id="o_s1" inputmode="decimal" placeholder="302,88">'+

    '<div><label class="fl">Cosa hai preso</label><div id="o_items"></div>'+
     '<button class="btn ghost" id="o_add" style="padding:10px;margin-top:8px">+ Aggiungi articolo</button></div>'+
    '<div class="note" id="o_prev">Scrivi il totale e i pezzi per vedere quanto ti costa ognuno.</div>'+
    '<p class="err" id="o_err" hidden></p>'+
    '<button class="btn" id="o_go">Registra ordine</button></div>');
  drawItems();
  document.getElementById("o_add").onclick=function(){readItems();draftItems.push({n:"",q:"",p:""});drawItems();};
  document.getElementById("o_s1").oninput=preview;
  bind("o_go",function(){
    readItems();
    var items=draftItems.filter(function(i){return i.n.trim()&&num(i.q)>0;}).map(function(i){
      return {id:uid(),name:i.n.trim(),qty:Math.round(num(i.q))};});
    if(!items.length)return showErr("o_err","Aggiungi almeno un articolo con nome e quantità.");
    var tot=num(v("o_s1"));
    if(tot<=0)return showErr("o_err","Scrivi quanto hai pagato in tutto.");
    var o={id:uid(),name:v("o_name").trim()||"Ordine",date:vd("o_d"),wallet:v("o_w"),
      total:tot,ship2:0,ship2paid:false,items:items};
    S.orders.push(o);

function drawItems(){
  document.getElementById("o_items").innerHTML=draftItems.map(function(it,i){
    return '<div class="itemrow" style="margin-bottom:7px">'+
     '<input class="fi" data-i="'+i+'" data-f="n" placeholder="es. Pochette" value="'+esc(it.n)+'">'+
     '<input class="fi mono" data-i="'+i+'" data-f="q" inputmode="numeric" placeholder="Qtà" value="'+esc(it.q)+'">'+
     (draftItems.length>1?'<button class="mini" data-rm="'+i+'">−</button>':'<span></span>')+'</div>';
  }).join("");
  var box=document.getElementById("o_items");
  box.oninput=preview;
  box.onclick=function(e){
    var b=e.target.closest("[data-rm]");if(!b)return;
    readItems();draftItems.splice(parseInt(b.getAttribute("data-rm"),10),1);drawItems();preview();
  };
  preview();
}
function readItems(){
  var box=document.getElementById("o_items");if(!box)return;
  box.querySelectorAll("input").forEach(function(inp){
    var i=parseInt(inp.getAttribute("data-i"),10);
    if(draftItems[i])draftItems[i][inp.getAttribute("data-f")]=inp.value;
  });
}
function preview(){
  readItems();
  var pieces=draftItems.reduce(function(t,i){return t+num(i.q);},0);
  var tot=num(v("o_s1"));
  var el=document.getElementById("o_prev");if(!el)return;
  if(!pieces||!tot){el.textContent="Scrivi il totale e i pezzi per vedere quanto ti costa ognuno.";return;}
  el.innerHTML="<b>"+pieces+" pezzi</b> per <b>"+eur(tot)+"</b> → "+eur(tot/pieces)+
   " a pezzo.<br>È un costo provvisorio: quando paghi la spedizione per l'Italia si aggiorna.";
}

function sheetOrderEdit(id){
  var o=find(S.orders,id);if(!o)return;
  var h='<h3>Modifica ordine</h3><p class="hint">Correggi prezzi, quantità e spedizioni. I costi si ricalcolano.</p>'+
   '<div class="f"><div><label class="fl">Nome</label>'+

    '<div><label class="fl">Sped. Italia</label>'+
    '<input class="fi mono" id="e_s2" inputmode="decimal" value="'+

       '<input class="fi" id="e_n'+i+'" value="'+esc(it.name)+'">'+
       '<input class="fi mono" id="e_q'+i+'" inputmode="numeric" value="'+it.qty+'">'+
       '<span class="tile-s" style="text-align:center">'+(sold?"−"+sold:"")+'</span>'+
       '</div>';
    }).join("")+
    '<p class="tile-s">Il numero a destra sono i pezzi già venduti: sotto quello non si può scendere.</p></div>'+
   '<p class="err" id="e_err" hidden></p>'+
   '<button class="btn" id="e_go">Salva modifiche</button></div>';
  openSheet(h);
  bind("e_go",function(){
    for(var i=0;i<o.items.length;i++){
      var q=Math.round(num(v("e_q"+i))),sold=soldQty(o.id,o.items[i].id);
      if(q<sold)return showErr("e_err","«"+o.items[i].name+"»: hai già venduto "+sold+" pezzi, la quantità non può essere "+q+".");
      if(q<0)return showErr("e_err","Le quantità non possono essere negative.");
    }
    o.name=v("e_name").trim()||o.name;
    for(var j=0;j<o.items.length;j++){
      o.items[j].name=v("e_n"+j).trim()||o.items[j].name;
      o.items[j].qty=Math.round(num(v("e_q"+j)));
    }
    o.total=num(v("e_s1"));
    var s2=v("e_s2").trim();
    if(s2===""){o.ship2=0;o.ship2paid=false;unpost("order2:"+o.id);}
    else{o.ship2=num(s2);o.ship2paid=true;}
    /* riscrivo le uscite collegate con gli importi nuovi */
    var w=o.wallet||"conto";
    unpost("order:"+o.id);
    post(w,-oPaid(o),"Ordine "+o.name,"ordine","order:"+o.id,o.date);
    if(o.ship2paid){
      unpost("order2:"+o.id);
      post(w,-num(o.ship2),"Spedizione "+o.name,"spedizione","order2:"+o.id,o.date);
    }
    save();closeSheet();render();toast("Ordine aggiornato");
  });
}

   '<div class="f2"><div><label class="fl">Dove</label><select class="fi" id="v_c">'+
     '<option>Vinted</option><option>Wallapop</option><option>Di persona</option><option>Altro</option></select></div>'+
    '<div><label class="fl">Incassato su</label>'+walletSel("v_w","contanti")+'</div></div>'+
   '<div><label class="fl">Data</label>'+dateIn("v_d")+'</div>'+

   '<p class="err" id="v_err" hidden></p>'+
   '<button class="btn" id="v_go">Registra vendita</button></div>');
  ["v_it","v_q","v_p"].forEach(function(id){document.getElementById(id).oninput=vPrev;
    document.getElementById(id).onchange=vPrev;});
  vPrev();
  bind("v_go",function(){
    var k=v("v_it").split("|"),o=find(S.orders,k[0]);if(!o){BUSY=false;return;}
    var it=find(o.items,k[1]),q=Math.round(num(v("v_q"))),p=num(v("v_p"));
    if(q<1)return showErr("v_err","La quantità deve essere almeno 1.");

    S.sales.push(s);
    post(s.wallet,p,"Venduto "+it.name+(q>1?" ×"+q:""),"vendita","sale:"+s.id,s.date);
    save();closeSheet();render();toast("Vendita registrata");
  });
}
function vPrev(){
  var el=document.getElementById("v_prev");if(!el)return;
  var k=v("v_it").split("|"),o=find(S.orders,k[0]);if(!o)return;
  var it=find(o.items,k[1]),q=Math.round(num(v("v_q")))||1,p=num(v("v_p"));
  var c=unitCost(o,it)*q,pr=p-c;
  el.innerHTML="Costo medio dell'ordine: <b>"+eur(c)+"</b>"+(oOpen(o)?" (provvisorio, manca la spedizione)":"")+
   (p>0?" · ci guadagni <b>"+eur(pr,true)+"</b>":"");
}

   '<div class="f">'+
   '<div class="f2"><div><label class="fl">Token</label>'+
    '<input class="fi mono" id="d_k" inputmode="numeric" value="'+esc(p.tokens||"")+'"></div>'+
    '<div><label class="fl">Valore in €</label>'+
    '<input class="fi mono" id="d_v" inputmode="decimal" value="'+
      (num(p.value)?String(num(p.value).toFixed(2)).replace(".",","):"")+'"></div></div>'+
   '<div class="tile-s" id="d_calc"></div>'+
   '<div><label class="fl">A che punto sta</label>'+
    '<select class="fi" id="d_s">'+
    ["invitato","registrato","accreditato","convertito","speso"].map(function(x){
      return '<option'+(p.status===x?" selected":"")+'>'+x+'</option>';}).join("")+
    '</select>'+
    '<p class="tile-s" style="margin:7px 0 0">Accreditato e convertito contano come buoni ancora da usare. Metti <b>speso</b> quando li hai usati davvero.</p></div>'+
   '<div><label class="fl">Convertito in</label>'+
    '<input class="fi" id="d_into" placeholder="es. buono Amazon, benzina..." value="'+esc(p.into||"")+'"></div>'+
   '<button class="btn" id="d_go">Salva</button>'+
   '<button class="btn danger" data-delpromo="'+p.id+'">Elimina</button></div>';
  openSheet(h);
  var dk=document.getElementById("d_k");
  function dcalc(){
    var k=num(dk.value);
    document.getElementById("d_calc").textContent=k>0?
      (k.toLocaleString("it-IT")+" token valgono "+eur(k*TOKEN_EUR)):"7600 token = 30 €.";
  }
  dk.oninput=function(){
    var k=num(this.value);
    if(k>0)document.getElementById("d_v").value=(k*TOKEN_EUR).toFixed(2).replace(".",",");
    dcalc();
  };
  dcalc();
  bind("d_go",function(){
    var tk=Math.round(num(v("d_k"))),val=num(v("d_v"));
    if(!val&&tk)val=tk*TOKEN_EUR;
    p.tokens=tk;p.value=val;p.status=v("d_s");p.into=v("d_into").trim();
    save();closeSheet();render();toast("Aggiornato");
  });
}
function segify(id){
  var el=document.getElementById(id);if(!el)return;
  el.onclick=function(e){var b=e.target.closest("button");if(!b)return;
    el.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});b.classList.add("on");};
}
function segVal(id){var el=document.getElementById(id);var b=el&&el.querySelector("button.on");
  return b?b.getAttribute("data-s"):"";}

/* ---- gioco ---- */
function sheetPlay(storico){
  openSheet('<h3>'+(storico?"Situazione di partenza":"Gioco")+'</h3>'+
   '<p class="hint">'+(storico?
     "Quanto sei sotto (o sopra) da prima di usare l'app. Non tocca contanti e conto.":
     "Solo quanto metti dentro e quanto tiri fuori.")+'</p>'+
   '<div class="f"><div><label class="fl">Cosa</label><div class="seg" id="g_k">'+
    '<button class="on" data-s="deposito">'+(storico?"Sono sotto":"Deposito")+'</button>'+
    '<button data-s="prelievo">'+(storico?"Sono sopra":"Prelievo")+'</button></div></div>'+
   '<div><label class="fl">Importo</label><input class="fi mono" id="g_a" inputmode="decimal" placeholder="0,00"></div>'+
   '<div><label class="fl">Soldi presi da</label><select class="fi" id="g_w">'+
    '<option value="conto"'+(storico?"":" selected")+'>Conto</option>'+
    '<option value="contanti">Contanti</option>'+
    '<option value="nessuno"'+(storico?" selected":"")+'>Nessuno — è già successo prima</option>'+
    '</select>'+
    '<p class="tile-s" style="margin:7px 0 0">Scegli <b>Nessuno</b> per i soldi giocati in passato: entrano nel saldo del gioco ma non toccano i tuoi portafogli.</p></div>'+
   '<div><label class="fl">Data</label>'+dateIn("g_d")+'</div>'+
   '<div><label class="fl">Nota</label><input class="fi" id="g_n" placeholder="es. Sisal"></div>'+
   '<p class="err" id="g_err" hidden></p>'+
   '<button class="btn" id="g_go">Registra</button></div>');
  segify("g_k");
  bind("g_go",function(){
    var a=num(v("g_a"));if(a<=0)return showErr("g_err","Metti un importo maggiore di zero.");
    var k=segVal("g_k");
    var p={id:uid(),kind:k,amount:a,wallet:v("g_w"),date:vd("g_d"),note:v("g_n").trim()};
    S.play.push(p);
    if(p.wallet!=="nessuno")
      post(p.wallet,k==="deposito"?-a:a,(k==="deposito"?"Deposito gioco":"Prelievo gioco")+
        (p.note?" · "+p.note:""),"gioco","play:"+p.id,p.date);
    save();closeSheet();render();
    toast(k==="deposito"?"Deposito registrato":"Prelievo registrato");
  });
}

/* ---- debiti ---- */
function sheetDebt(){
  openSheet('<h3>Nuovo debito</h3><p class="hint">Klarna, rate, soldi che devi restituire.</p>'+
   '<div class="f"><div><label class="fl">Nome</label><input class="fi" id="k_n" placeholder="es. Klarna kway"></div>'+
   '<div class="f2"><div><label class="fl">Totale</label>'+
    '<input class="fi mono" id="k_t" inputmode="decimal" placeholder="0,00"></div>'+
    '<div><label class="fl">Ancora da pagare</label>'+
    '<input class="fi mono" id="k_l" inputmode="decimal" placeholder="0,00"></div></div>'+
   '<p class="err" id="k_err" hidden></p>'+
   '<button class="btn" id="k_go">Aggiungi</button></div>');
  bind("k_go",function(){
    var n=v("k_n").trim();if(!n)return showErr("k_err","Dai un nome al debito.");
    var t=num(v("k_t")),l=num(v("k_l"))||t;
    S.debts.push({id:uid(),name:n,total:t||l,left:l});
    save();closeSheet();render();toast("Debito aggiunto");
  });
}
function sheetPay(id){
  var d=find(S.debts,id);if(!d)return;
  openSheet('<h3>'+esc(d.name)+'</h3><p class="hint">Restano '+eur(num(d.left))+'.</p>'+
   '<div class="f"><div><label class="fl">Rata pagata</label>'+
   '<input class="fi mono" id="r_a" inputmode="decimal" placeholder="0,00"></div>'+
   '<div><label class="fl">Pagata da</label>'+walletSel("r_w","conto")+'</div>'+
   '<button class="btn" id="r_go">Registra pagamento</button></div>');
  bind("r_go",function(){
    var a=num(v("r_a"));if(a<=0)return fail("Metti l'importo della rata");
    d.left=Math.max(0,num(d.left)-a);
    post(v("r_w"),-a,"Rata "+d.name,"rata","rata:"+d.id+":"+a,today());
    save();closeSheet();render();toast("Rata registrata");
  });
}

/* ---- conferma senza confirm() del browser (bloccato in certi contesti) ---- */
function ask(title,text,okLabel,onOk){
  var w=document.getElementById("ask");
  document.getElementById("askBox").innerHTML=
    '<b>'+esc(title)+'</b><p>'+esc(text)+'</p><div class="modalrow">'+
    '<button class="btn ghost" id="askNo">Annulla</button>'+
    '<button class="btn danger" id="askYes">'+esc(okLabel)+'</button></div>';
  w.classList.add("on");
  document.getElementById("askNo").onclick=function(){w.classList.remove("on");};
  document.getElementById("askYes").onclick=function(){w.classList.remove("on");onOk();};
  w.onclick=function(e){if(e.target===w)w.classList.remove("on");};
}
/* ---- un tocco = una registrazione, anche se tocchi due volte ---- */
var BUSY=false;
function bind(id,fn){
  var el=document.getElementById(id);if(!el)return;
  el.onclick=function(){
    if(BUSY)return;
    BUSY=true;setTimeout(function(){BUSY=false;},500);
    fn();
  };
}
/* se la registrazione non va a buon fine sblocco subito: puoi correggere e riprovare */
function fail(m){toast(m);BUSY=false;}

/* ============================ EVENTI ============================ */
document.getElementById("fab").onclick=sheetAdd;
document.getElementById("scrim").onclick=closeSheet;

var SHEETS={spesa:function(){sheetFlow("spesa");},entrata:function(){sheetFlow("entrata");},
  giro:sheetGiro,order:sheetOrder,sale:function(){sheetSale();},promo:sheetPromo,
  play:function(){sheetPlay(false);},storico:function(){sheetPlay(true);},debt:sheetDebt};

document.addEventListener("click",function(e){
  var t=e.target;
  var tab=t.closest("[data-tab]");if(tab)return go(tab.getAttribute("data-tab"));
  var g=t.closest("[data-go]");if(g)return go(g.getAttribute("data-go"));
  var sh=t.closest("[data-sheet]");if(sh){var f=SHEETS[sh.getAttribute("data-sheet")];if(f)f();return;}
  var adj=t.closest("[data-adj]");if(adj)return sheetAdjust(adj.getAttribute("data-adj"));
  var oe=t.closest("[data-editorder]");
  if(oe){var oid2=oe.getAttribute("data-editorder");closeSheet();
    setTimeout(function(){sheetOrderEdit(oid2);},280);return;}
  var od=t.closest("[data-order]");if(od)return sheetOrderDetail(od.getAttribute("data-order"));
  var sl=t.closest("[data-sell]");if(sl){closeSheet();setTimeout(function(){sheetSale(sl.getAttribute("data-sell"));},280);return;}
  var pr=t.closest("[data-promo]");if(pr)return sheetPromoDetail(pr.getAttribute("data-promo"));
  var py=t.closest("[data-pay]");if(py)return sheetPay(py.getAttribute("data-pay"));

  var dl=t.closest("[data-del-led]");
  if(dl){
    var lid=dl.getAttribute("data-del-led"),en=null;
    for(var i=0;i<S.ledger.length;i++)if(S.ledger[i].id===lid)en=S.ledger[i];
    if(!en)return;
    if(en.ref&&en.k!=="rata"&&en.k!=="giro")
      return toast("Questo si elimina dalla sua sezione: ordine, vendita o gioco");
    if(en.k==="giro"){
      ask("Eliminare il giro?","Spariscono tutte e due le righe, l'uscita e l'entrata.","Elimina",function(){
        unpost(en.ref);save();render();toast("Giro eliminato");
      });
      return;
    }
    ask("Eliminare?","«"+en.l+"» da "+eur(en.a,true)+". Non si torna indietro.","Elimina",function(){
      if(en.k==="rata"&&en.ref){
        var pr=String(en.ref).split(":"),d=find(S.debts,pr[1]);
        if(d)d.left=num(d.left)+num(pr[2]);
      }
      S.ledger=S.ledger.filter(function(x){return x.id!==lid;});
      save();render();toast("Eliminato");
    });
    return;
  }
  var ds=t.closest("[data-del-sale]");
  if(ds){
    var sid=ds.getAttribute("data-del-sale");
    ask("Eliminare la vendita?","Il pezzo torna in magazzino e l'incasso viene tolto.","Elimina",function(){
      S.sales=S.sales.filter(function(x){return x.id!==sid;});unpost("sale:"+sid);
      save();render();toast("Vendita eliminata");
    });
    return;
  }
  var dp=t.closest("[data-del-play]");
  if(dp){
    var pid=dp.getAttribute("data-del-play");
    ask("Eliminare?","Questo movimento di gioco sparisce e il saldo si ricalcola.","Elimina",function(){
      S.play=S.play.filter(function(x){return x.id!==pid;});unpost("play:"+pid);
      save();render();toast("Eliminato");
    });
    return;
  }
  var dor=t.closest("[data-delorder]");
  if(dor){
    var oid=dor.getAttribute("data-delorder");
    var nsales=S.sales.filter(function(x){return x.oid===oid;}).length;
    ask("Eliminare l'ordine?",nsales?("Spariscono anche le "+nsales+" vendite collegate."):"Sparisce anche la spesa collegata.","Elimina",function(){
      S.sales.filter(function(x){return x.oid===oid;}).forEach(function(x){unpost("sale:"+x.id);});
      S.sales=S.sales.filter(function(x){return x.oid!==oid;});
      S.orders=S.orders.filter(function(o){return o.id!==oid;});
      unpost("order:"+oid);unpost("order2:"+oid);
      save();closeSheet();render();toast("Ordine eliminato");
    });
    return;
  }
  var dpr=t.closest("[data-delpromo]");
  if(dpr){
    var prid=dpr.getAttribute("data-delpromo");
    ask("Eliminare la promo?","La persona sparisce dall'elenco.","Elimina",function(){
      S.promos=S.promos.filter(function(x){return x.id!==prid;});
      save();closeSheet();render();toast("Promo eliminata");
    });
    return;
  }
  var dd=t.closest("[data-deldebt]");
  if(dd){
    var did=dd.getAttribute("data-deldebt");
    ask("Eliminare il debito?","Le rate gia pagate restano nei movimenti.","Elimina",function(){
      S.debts=S.debts.filter(function(x){return x.id!==did;});
      save();render();toast("Debito eliminato");
    });
    return;
  }

  if(t.id==="bkCopy"){
    var ta=document.getElementById("bkOut");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){
        S.bk=records();save();render();toast("Backup copiato: incollalo nelle Note");},
        function(){ta.select();toast("Tieni premuto sul testo e copia");});
    }else{ta.select();ta.setSelectionRange(0,999999);S.bk=records();save();toast("Tieni premuto sul testo e copia");}
    return;
  }
  if(t.id==="bkRestore"){
    var raw=document.getElementById("bkIn").value.trim();
    if(!raw)return toast("Incolla prima il backup");
    var d;
    try{d=JSON.parse(raw);}catch(err){return toast("Questo testo non e un backup valido");}
    if(!d||!Array.isArray(d.ledger))return toast("Questo testo non e un backup valido");
    ask("Ripristinare?","Tutti i dati di adesso vengono sostituiti da quelli del backup.","Ripristina",function(){
      S=d;for(var k in blank)if(!(k in S))S[k]=Array.isArray(blank[k])?[]:blank[k];
      save();go("home");toast("Dati ripristinati");
    });
    return;
  }
  if(t.id==="wipe"){
    ask("Cancellare tutto?","Sparisce ogni movimento, ordine, promo e debito. Non si torna indietro.","Cancella tutto",function(){
      S=JSON.parse(JSON.stringify(blank));save();go("home");toast("Tutto cancellato");
    });
    return;
  }
});
/* tastiera: il + funziona anche con Invio, e il campo attivo non finisce sotto la tastiera */
document.getElementById("fab").addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){e.preventDefault();sheetAdd();}
});
document.addEventListener("focusin",function(e){
  if(!e.target.closest(".sheet"))return;
  setTimeout(function(){
    try{e.target.scrollIntoView({block:"center",behavior:"smooth"});}catch(err){}
  },320);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
render();
</script>
