<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CB29 Economy">
<meta name="theme-color" content="#0F1115">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230D1014'/%3E%3Ctext x='90' y='116' font-family='Helvetica,Arial' font-size='62' font-weight='bold' fill='%23E3A84A' text-anchor='middle'%3ECB%3C/text%3E%3C/svg%3E">

<body>
<title>CB29 Economy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0F1115; --bg-2:#12141A; --surf:#171A20; --surf-2:#1B1F27;
  --line:#22262F; --line-2:#2C313B;
  --tx:#FFFFFF; --tx-2:#8B93A1; --tx-3:#6E7686;
  --acc:#8B9BF7; --acc-soft:rgba(139,155,247,.14);
  --pos:#4FC98A; --pos-soft:rgba(79,201,138,.13);
  --neg:#FF7A70; --neg-soft:rgba(255,122,112,.13);
  --warn:#E0A23C; --warn-soft:rgba(224,162,60,.14);
  --r:20px; --r-sm:16px; --r-xs:12px;
  --ff:"Onest",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}

#app{max-width:460px;margin:0 auto;padding:env(safe-area-inset-top) 20px 112px;min-height:100vh}

/* ---------- intestazione ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 12px}
.hdr h1{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0}
.hdr-sub{font-size:12.5px;color:var(--tx-2)}
.hdr-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--surf-2);display:grid;place-items:center;
  font-size:15px;font-weight:600;color:#C6CBD5;flex:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surf);
  display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:active{background:var(--surf-2)}
.pill-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
  background:var(--surf);border:1px solid var(--line);color:#C6CBD5;font-size:12.5px;font-weight:500;cursor:pointer}
.pill-btn:active{background:var(--surf-2)}

/* ---------- saldo ---------- */
.hero{padding:10px 0 0}
.hero .lab{font-size:13px;color:var(--tx-2)}
.hero .big{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:5px}
.hero .extra{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--tx-2);
  cursor:pointer}
.chip-delta{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 11px;border-radius:999px;
  font-size:12.5px;font-weight:500}

/* ---------- azioni rotonde ---------- */
.actions{display:flex;justify-content:space-between;gap:8px;padding:22px 0 4px}
.act-b{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
  flex:1;padding:0}
.act-b i{width:54px;height:54px;border-radius:50%;background:var(--surf-2);border:1px solid var(--line);
  display:grid;place-items:center;font-style:normal}
.act-b.primary i{background:var(--acc);border-color:var(--acc)}
.act-b span{font-size:11.5px;color:#C6CBD5}
.act-b:active i{opacity:.75}

/* ---------- schede ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:4px 16px}
.card+.card{margin-top:9px}
.sec{margin-top:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}
.sec-h h2{font-size:14px;font-weight:600;margin:0}
.sec-h .link{font-size:13px;color:var(--acc);cursor:pointer;background:none;border:0;padding:0;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);padding:15px 16px;
  text-align:left;cursor:pointer;width:100%}
.stat .t{font-size:12.5px;color:var(--tx-2)}
.stat .v{font-size:20px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--tx-3);margin-top:3px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .acc{color:var(--acc)} .warn{color:var(--warn)}
.mut{color:var(--tx-2)}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--pos-soft);color:var(--pos)}
.tag.wait{background:var(--warn-soft);color:var(--warn)}
.tag.off{background:rgba(139,147,161,.12);color:var(--tx-2)}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* ---------- righe ---------- */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;
  text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.row:last-child{border-bottom:0}
.row-i{width:38px;height:38px;border-radius:var(--r-xs);background:var(--acc-soft);display:grid;place-items:center;
  flex:none;font-size:13.5px;font-weight:600;color:var(--acc)}
.row-m{flex:1;min-width:0}
.row-m b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m span{display:block;font-size:12px;color:var(--tx-2);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row-a{font-size:14.5px;font-weight:600;white-space:nowrap}
.row-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chev{flex:none}
.empty{padding:26px 14px;text-align:center;color:var(--tx-3);font-size:13.5px;line-height:1.6}

.bar{height:6px;border-radius:999px;background:var(--surf-2);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width .35s ease}
.bar i.done{background:var(--pos)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13.5px}
.kv span{color:var(--tx-2)}
.kv b{font-weight:600}
.kv.top{border-top:1px solid var(--line);margin-top:7px;padding-top:14px}

/* ---------- barra in basso ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(18,20,26,.94);
  backdrop-filter:blur(16px);border-top:1px solid var(--surf-2);padding:9px 0 max(12px,env(safe-area-inset-bottom))}
.tabbar-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:0 12px}
.tab{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--tx-3);cursor:pointer;font-size:10.5px}
.tab.on{color:var(--acc);font-weight:500}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- pannelli ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--bg-2);border-top:1px solid var(--line);border-radius:26px 26px 0 0;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheet-in{max-width:460px;margin:0 auto;padding:10px 20px calc(28px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line-2);margin:0 auto 16px}
.sheet h3{font-size:21px;font-weight:600;margin:0 0 4px;letter-spacing:-.02em}
.sheet .hint{font-size:13.5px;color:var(--tx-2);margin:0 0 18px;line-height:1.5}

/* ---------- moduli ---------- */
.f{display:flex;flex-direction:column;gap:14px}
.fl{font-size:12.5px;color:var(--tx-2);display:block;margin-bottom:7px}
.fi{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;font-size:16px;outline:none}
.fi:focus{border-color:var(--acc)}
select.fi{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx-3) 50%),linear-gradient(135deg,var(--tx-3) 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seg{display:flex;gap:5px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px 4px;border:0;background:none;border-radius:11px;font-size:13.5px;font-weight:500;
  color:var(--tx-2);cursor:pointer}
.seg button.on{background:var(--surf-2);color:var(--tx)}
.btn{width:100%;padding:16px;border:0;border-radius:16px;background:var(--acc);color:#141726;
  font-weight:600;font-size:15.5px;cursor:pointer;font-family:var(--ff)}
.btn:active{opacity:.85}
.btn.ghost{background:var(--surf);color:var(--tx);border:1px solid var(--line);font-weight:500}
.btn.danger{background:none;color:var(--neg);border:1px solid rgba(255,122,112,.3)}
.act{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;cursor:pointer;margin-bottom:9px}
.act:active{background:var(--surf-2)}
.act i{width:38px;height:38px;border-radius:var(--r-xs);display:grid;place-items:center;flex:none;font-style:normal;
  font-weight:600;font-size:15px}
.act b{display:block;font-size:14.5px;font-weight:500}
.act span{font-size:12.5px;color:var(--tx-2)}
.err{color:var(--neg);font-size:13px;margin:0}
.note{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:13px 15px;font-size:12.5px;color:var(--tx-2);line-height:1.55}
.note b{color:#C6CBD5;font-weight:600}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%) translateY(20px);bottom:100px;
  background:var(--surf-2);border:1px solid var(--line-2);color:var(--tx);padding:12px 18px;border-radius:14px;
  font-size:13.5px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.itemrow{display:grid;grid-template-columns:1fr 74px 38px;gap:8px;align-items:center}
.itemrow .fi{padding:11px 12px;font-size:15px}
.mini{background:none;border:1px solid var(--line);border-radius:12px;color:var(--tx-2);cursor:pointer;
  height:45px;display:grid;place-items:center;font-size:18px}
textarea.fi{min-height:130px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.5;resize:vertical}
h4.sub{font-size:14px;font-weight:600;color:var(--tx);margin:22px 0 10px}

/* ---------- grafici ---------- */
.chart{width:100%;display:block;touch-action:pan-y}
.chart-wrap{position:relative}
.tip{position:absolute;top:0;left:0;transform:translate(-50%,-108%);pointer-events:none;
  background:var(--surf-2);border:1px solid var(--line-2);border-radius:11px;padding:7px 11px;
  font-size:12px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:2}
.tip.on{opacity:1}
.tip b{display:block;font-size:13.5px;font-weight:600}
.tip span{color:var(--tx-3);font-size:11px}
.xlab{display:flex;justify-content:space-between;margin-top:8px}
.xlab span{font-size:11px;color:var(--tx-3)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--surf);color:var(--tx-2);font-size:16px;cursor:pointer}
.mnav button:disabled{opacity:.3}
.mnav h2{font-size:15px;font-weight:600;margin:0;text-align:center;flex:1}

/* ---------- blocco ---------- */
#lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top))}
#lock.on{display:flex}
#lock h2{font-size:22px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em}
#lock p{font-size:13.5px;color:var(--tx-2);margin:0 0 30px}
.dots{display:flex;gap:14px;margin-bottom:36px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);display:block;transition:.15s}
.dots i.f{background:var(--acc);border-color:var(--acc)}
#lock.bad .dots{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:15px;justify-content:center}
.pad button{height:66px;border-radius:50%;border:1px solid var(--line);background:var(--surf);
  font-size:23px;font-weight:500;color:var(--tx);cursor:pointer;font-family:var(--ff)}
.pad button:active{background:var(--surf-2)}
.pad button.blank{border:0;background:none;cursor:default}
.pad button.del{font-size:14px;color:var(--tx-2)}

/* ---------- conferma ---------- */
.modalwrap{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:24px;
  background:rgba(0,0,0,.66)}
.modalwrap.on{display:grid}
.modalbox{background:var(--bg-2);border:1px solid var(--line-2);border-radius:22px;padding:22px;
  max-width:340px;width:100%}
.modalbox p{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--tx-2)}
.modalbox b{font-size:17.5px;font-weight:600;display:block;margin-bottom:8px;color:var(--tx)}
.modalrow{display:flex;gap:10px}
.modalrow .btn{padding:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<nav class="tabbar"><div class="tabbar-in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<div id="lock">
  <h2>CB29 Economy</h2>
  <p id="lockMsg">Inserisci il tuo codice</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</div>
<div class="modalwrap" id="ask"><div class="modalbox" id="askBox"></div></div>

<script>
"use strict";
/* ============================ STATO ============================ */
var KEY="cb29economy.v1";
var TOKEN_EUR=30/7600; /* 7600 isytoken = 30 € */
var CATS=["Vestiti","Fornitori cinesi","Casa","Regali","Cura personale","Cibo","Abbonamenti","Altro"];
var CATS_IN=["Vendita","Promo","Regalo","Paghetta","Rimborso","Altro"];
var blank={v:1,ledger:[],orders:[],sales:[],promos:[],play:[],debts:[],bk:0};
var S=load();

function load(){
  try{var r=localStorage.getItem(KEY);
    if(!r){var legacy=localStorage.getItem("soldicamera.v1");
      if(legacy){localStorage.setItem(KEY,legacy);r=legacy;}}
    if(!r)return JSON.parse(JSON.stringify(blank));
    var d=JSON.parse(r);for(var k in blank)if(!(k in d))d[k]=Array.isArray(blank[k])?[]:blank[k];
    ["ledger","orders","sales","promos","play","debts"].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
    d.orders.forEach(function(o){
      if(!Array.isArray(o.items))o.items=[];
      if(o.total===undefined||o.total===null){
        var g=0;o.items.forEach(function(i){g+=(i.qty||0)*(i.price||0);});
        o.total=g+(parseFloat(o.ship1)||0);
      }
      o.items.forEach(function(i){i.qty=Math.round(i.qty)||0;});
    });
    d.sales=d.sales.filter(function(x){
      var o=null,i;for(i=0;i<d.orders.length;i++)if(d.orders[i].id===x.oid)o=d.orders[i];
      if(!o)return false;
      for(i=0;i<o.items.length;i++)if(o.items[i].id===x.iid)return true;
      return false;});
    return d;}
  catch(e){return JSON.parse(JSON.stringify(blank));}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Spazio esaurito: fai un backup");}}
function records(){return S.ledger.length+S.orders.length+S.sales.length+S.promos.length+S.play.length+S.debts.length;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ============================ UTIL ============================ */
function num(x){
  if(typeof x==="number")return x;
  var s=String(x||"").replace(/[^0-9.,-]/g,"").trim();
  if(!s)return 0;
  if(s.indexOf(",")>-1&&s.indexOf(".")>-1)s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  else s=s.replace(",",".");
  var n=parseFloat(s);return isNaN(n)?0:n;
}
function eur(n,sign){
  var s=(Math.abs(n)).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
  var p=n<0?"-":(sign&&n>0?"+":"");
  return p+s+" €";
}
function eur0(n){return Math.round(n).toLocaleString("it-IT")+" €";}
function today(){var d=new Date();return d.toISOString().slice(0,10);}
function dmy(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1];}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function monthOf(s){return (s||"").slice(0,7);}
function curMonth(){return today().slice(0,7);}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove("on");},2100);}

/* ============================ LEDGER ============================ */
/* ogni evento che muove soldi veri scrive qui */
function post(wallet,amount,label,kind,ref,date,cat){
  S.ledger.push({id:uid(),w:wallet,a:amount,l:label,k:kind,ref:ref||null,d:date||today(),c:cat||""});
}
function unpost(ref){S.ledger=S.ledger.filter(function(e){return e.ref!==ref;});}
function balance(w){return S.ledger.reduce(function(t,e){return e.w===w?t+e.a:t;},0);}

/* ============================ BUSINESS ============================ */
function oPieces(o){return o.items.reduce(function(t,i){return t+i.qty;},0);}
function oShare(o){var q=num(o.share);return (q>0&&q<=1)?q:1;}   /* quanto dell'ordine e tuo */
function oSocio(o){return oShare(o)<1;}
function oPaid(o){return num(o.total);}                    /* tutto compreso fino al magazzino */
function oShip2(o){return o.ship2paid?num(o.ship2):0;}     /* spedizione per l'Italia */
function oCost(o){return oPaid(o)+oShip2(o);}
function oOpen(o){return !o.ship2paid;}
function oState(o){
  if(!o.ship2paid)return {k:"pagare",t:"spedizione da pagare",c:"wait"};
  if(!o.arrived)return {k:"transito",t:"in transito",c:""};
  return {k:"arrivato",t:"arrivato",c:"ok"};
}
function unitCost(o,it){var p=oPieces(o);return p?oCost(o)/p:0;}
function soldQty(oid,iid){return S.sales.reduce(function(t,s){return (s.oid===oid&&s.iid===iid)?t+s.qty:t;},0);}
function leftQty(o,it){return Math.max(0,it.qty-soldQty(o.id,it.id));}
function oRevenue(oid){return S.sales.reduce(function(t,s){return s.oid===oid?t+s.price:t;},0);}
function stockValue(){                     /* quanto ti costa la roba invenduta, la tua parte */
  return S.orders.reduce(function(t,o){
    return t+o.items.reduce(function(u,it){return u+leftQty(o,it)*unitCost(o,it);},0)*oShare(o);
  },0);
}
function stockByName(){
  var map={};
  S.orders.forEach(function(o){
    o.items.forEach(function(it){
      var q=leftQty(o,it);if(!q)return;
      var k=it.name.trim();
      if(!map[k])map[k]={n:k,q:0,v:0};
      map[k].q+=q;map[k].v+=q*unitCost(o,it)*oShare(o);
    });
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.q-a.q;});
}
function stockPieces(){
  return S.orders.reduce(function(t,o){
    return t+o.items.reduce(function(u,it){return u+leftQty(o,it);},0);},0);
}
function saleProfit(s){                    /* il profitto che resta a te */
  var o=find(S.orders,s.oid);if(!o)return 0;
  var it=find(o.items,s.iid);if(!it)return 0;
  return (s.price-unitCost(o,it)*s.qty)*oShare(o);
}
function saleSocio(s){                     /* quanto di quella vendita spetta al socio */
  var o=find(S.orders,s.oid);if(!o||!oSocio(o))return 0;
  return s.price*(1-oShare(o));
}
function socioDovuto(){                    /* da dare ai soci, sulle vendite gia fatte */
  return S.sales.reduce(function(t,x){return t+saleSocio(x);},0);
}
function oMyCost(o){return oCost(o)*oShare(o);}
function oMyRevenue(id){var o=find(S.orders,id);return oRevenue(id)*(o?oShare(o):1);}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}

/* ============================ TOTALI ============================ */
function debtLeft(){return S.debts.reduce(function(t,d){return t+num(d.left);},0);}
function playBalance(){return S.play.reduce(function(t,p){return t+(p.kind==="prelievo"?p.amount:-p.amount);},0);}
function playMonth(){return S.play.reduce(function(t,p){
  return monthOf(p.date)===curMonth()?t+(p.kind==="prelievo"?p.amount:-p.amount):t;},0);}
function promoWaiting(){return S.promos.reduce(function(t,p){
  return (p.status==="accreditato"||p.status==="convertito")?t+num(p.value):t;},0);}
function promoTokens(){return S.promos.reduce(function(t,p){
  return p.status==="accreditato"?t+(num(p.tokens)||0):t;},0);}
function promoTotal(){return S.promos.reduce(function(t,p){
  return (p.status==="invitato"||p.status==="registrato")?t:t+num(p.value);},0);}
function monthInOut(m){
  var i=0,u=0,adj=0;
  S.ledger.forEach(function(e){
    if(monthOf(e.d)!==m)return;
    if(e.k==="giro")return;              /* spostare soldi non e ne entrata ne spesa */
    if(e.k==="rettifica"){adj+=e.a;return;}
    if(e.a>0)i+=e.a;else u+=e.a;
  });
  return {in:i,out:u,adj:adj};
}
function catBreakdown(m){
  var map={};
  S.ledger.forEach(function(e){
    if(monthOf(e.d)!==m||e.a>=0||e.k==="giro")return;
    var k=e.c||({ordine:"Ordini fornitore",spedizione:"Ordini fornitore",rata:"Rate e debiti",
      gioco:"Gioco",vendita:"Vendite",rettifica:"Correzioni"}[e.k]||"Altro");
    map[k]=(map[k]||0)+Math.abs(e.a);
  });
  return Object.keys(map).map(function(k){return {k:k,v:map[k]};}).sort(function(a,b){return b.v-a.v;});
}
function liquid(){return balance("contanti")+balance("conto");}   /* quello che puoi spendere adesso */
function savings(){return balance("risparmi");}                   /* messi da parte */
/* quanti soldi avevi in tutto (contanti + conto + risparmi) fino a quella data:
   cosi spostare soldi tra i portafogli non risulta ne un guadagno ne una perdita */
function balanceAt(dateStr){
  return S.ledger.reduce(function(t,e){
    return (e.d<=dateStr&&(e.w==="contanti"||e.w==="conto"||e.w==="risparmi"))?t+e.a:t;},0);
}
function wealth(){return liquid()+savings();}
function firstMonth(){
  var m=null;
  S.ledger.forEach(function(e){var k=monthOf(e.d);if(k&&(!m||k<m))m=k;});
  return m||curMonth();
}
function addMonth(m,n){
  var p=m.split("-"),y=parseInt(p[0],10),mo=parseInt(p[1],10)-1+n;
  y+=Math.floor(mo/12);mo=((mo%12)+12)%12;
  return y+"-"+String(mo+1).padStart(2,"0");
}
function lastDay(m){
  var p=m.split("-"),d=new Date(parseInt(p[0],10),parseInt(p[1],10),0);
  return m+"-"+String(d.getDate()).padStart(2,"0");
}
/* saldo alla fine di ognuno degli ultimi n mesi */
function monthlySeries(n){
  var out=[],m=curMonth(),first=firstMonth(),start=m;
  for(var i=0;i<n-1;i++){var prev=addMonth(start,-1);if(prev<first)break;start=prev;}
  var cur=start;
  while(cur<=m){
    var end=(cur===m)?today():lastDay(cur);
    out.push({k:cur,lab:labMonth(cur).split(" ")[0].slice(0,3),v:balanceAt(end)});
    cur=addMonth(cur,1);
  }
  return out;
}
/* saldo giorno per giorno nel mese scelto */
function dailySeries(m){
  var p=m.split("-"),days=new Date(parseInt(p[0],10),parseInt(p[1],10),0).getDate();
  var oggi=today(),out=[];
  var last=(m===curMonth())?parseInt(oggi.slice(8,10),10):days;
  for(var d=1;d<=last;d++){
    var ds=m+"-"+String(d).padStart(2,"0");
    out.push({k:ds,lab:String(d),v:balanceAt(ds)});
  }
  return out;
}
function netWorth(){return liquid()-debtLeft();}   /* i soldi dell'ordine sono gia una spesa */
function profitMonth(){
  return S.sales.reduce(function(t,s){return monthOf(s.date)===curMonth()?t+saleProfit(s):t;},0);
}

var CHARTS={};
function chart(id,pts,h){
  h=h||132;
  var W=340,P=14,PT=16,PB=10;
  if(!pts.length)return '<div class="empty">Ancora nessun dato.</div>';
  if(pts.length===1)pts=[{k:pts[0].k,lab:pts[0].lab,v:pts[0].v},{k:pts[0].k,lab:pts[0].lab,v:pts[0].v}];
  var vals=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mn===mx){mn-=1;mx+=1;}
  var pad=(mx-mn)*0.16;mn-=pad;mx+=pad;
  var x=function(i){return P+i*((W-2*P)/(pts.length-1));};
  var y=function(v){return PT+(1-(v-mn)/(mx-mn))*(h-PT-PB);};
  var line=pts.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1);}).join(" ");
  var area=line+" L"+x(pts.length-1).toFixed(1)+" "+(h-PB)+" L"+x(0).toFixed(1)+" "+(h-PB)+" Z";
  var zero=(mn<0&&mx>0)?'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+
    '" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="3 4"/>':"";
  var lastI=pts.length-1;
  CHARTS[id]=pts;
  return '<div class="chart-wrap" id="w_'+id+'">'+
   '<svg class="chart" id="'+id+'" viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none" '+
     'role="img" aria-label="Andamento dei soldi">'+
    '<defs><linearGradient id="g_'+id+'" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0%" stop-color="#8B9BF7" stop-opacity=".30"/>'+
     '<stop offset="100%" stop-color="#8B9BF7" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+P+'" x2="'+(W-P)+'" y1="'+(h-PB)+'" y2="'+(h-PB)+'" stroke="var(--line)" stroke-width="1"/>'+
    zero+
    '<path d="'+area+'" fill="url(#g_'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="#8B9BF7" stroke-width="2" '+
      'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+x(lastI).toFixed(1)+'" cy="'+y(pts[lastI].v).toFixed(1)+'" r="4.5" fill="#8B9BF7" '+
      'stroke="var(--bg)" stroke-width="2"/>'+
    '<line class="cross" x1="0" x2="0" y1="'+PT+'" y2="'+(h-PB)+'" stroke="var(--line-2)" '+
      'stroke-width="1" opacity="0"/>'+
    '<circle class="dot" r="4.5" fill="#8B9BF7" stroke="var(--bg)" stroke-width="2" opacity="0"/>'+
   '</svg>'+
   '<div class="tip" id="t_'+id+'"></div>'+
   '<div class="xlab"><span>'+esc(pts[0].lab)+'</span><span>'+esc(pts[lastI].lab)+'</span></div>'+
   '</div>';
}
function attachCharts(){
  Object.keys(CHARTS).forEach(function(id){
    var svg=document.getElementById(id);if(!svg)return;
    var pts=CHARTS[id],tip=document.getElementById("t_"+id),wrap=document.getElementById("w_"+id);
    var cross=svg.querySelector(".cross"),dot=svg.querySelector(".dot");
    var W=340,P=14;
    function at(clientX){
      var r=svg.getBoundingClientRect();
      var rel=(clientX-r.left)/r.width*W;
      var step=(W-2*P)/(pts.length-1);
      var i=Math.round((rel-P)/step);
      i=Math.max(0,Math.min(pts.length-1,i));
      var vb=svg.viewBox.baseVal,hh=vb.height;
      var vals=pts.map(function(q){return q.v;});
      var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
      if(mn===mx){mn-=1;mx+=1;}
      var pad=(mx-mn)*0.16;mn-=pad;mx+=pad;
      var px=P+i*step,py=16+(1-(pts[i].v-mn)/(mx-mn))*(hh-16-10);
      cross.setAttribute("x1",px);cross.setAttribute("x2",px);cross.setAttribute("opacity","1");
      dot.setAttribute("cx",px);dot.setAttribute("cy",py);dot.setAttribute("opacity","1");
      tip.innerHTML='<span>'+esc(pts[i].lab)+'</span><b>'+eur(pts[i].v)+'</b>';
      tip.style.left=(px/W*100)+"%";
      tip.style.top=(py/hh*100)+"%";
      tip.classList.add("on");
    }
    function off(){cross.setAttribute("opacity","0");dot.setAttribute("opacity","0");tip.classList.remove("on");}
    svg.onmousemove=function(e){at(e.clientX);};
    svg.onmouseleave=off;
    svg.ontouchstart=function(e){at(e.touches[0].clientX);};
    svg.ontouchmove=function(e){at(e.touches[0].clientX);};
    svg.ontouchend=off;
    wrap.onclick=function(){};
  });
}

     '<input class="fi mono" id="o_s1" inputmode="decimal" placeholder="302,88">'+

     '<button class="on" data-s="mio">Tutto mio</button>'+
     '<button data-s="socio">In societ&agrave;</button></div>'+
     '<div id="o_socbox" hidden style="margin-top:11px">'+
      '<label class="fl">La tua quota</label>'+
      '<input class="fi mono" id="o_quota" inputmode="numeric" value="50" placeholder="50">'+
      '<p class="tile-s" style="margin:7px 0 0">In percentuale. La roba resta tutta a te, ma i guadagni si dividono cos&igrave;.</p>'+
     '</div></div>'+
    '<div class="note" id="o_prev">Scrivi il totale e i pezzi per vedere quanto ti costa ognuno.</div>'+
    '<div class="note">Se i soldi erano gi&agrave; usciti prima, o stai solo rifacendo un ordine che avevi cancellato, scegli <b>Nessuno</b>: l\'ordine entra nel business senza toccare conto e contanti.</div>'+
    '<p class="err" id="o_err" hidden></p>'+
    '<button class="btn" id="o_go">Registra ordine</button></div>');
  drawItems();
  segify("o_soc");
  document.getElementById("o_soc").addEventListener("click",function(){
    document.getElementById("o_socbox").hidden=(segVal("o_soc")!=="socio");
    preview();
  });
  document.getElementById("o_quota").oninput=preview;
  document.getElementById("o_add").onclick=function(){readItems();draftItems.push({n:"",q:"",p:""});drawItems();};
  document.getElementById("o_s1").oninput=preview;
  bind("o_go",function(){
    readItems();
    var items=draftItems.filter(function(i){return i.n.trim()&&num(i.q)>0;}).map(function(i){
      return {id:uid(),name:i.n.trim(),qty:Math.round(num(i.q))};});
    if(!items.length)return showErr("o_err","Aggiungi almeno un articolo con nome e quantità.");
    var tot=num(v("o_s1"));
    if(tot<=0)return showErr("o_err","Scrivi quanto hai pagato in tutto.");
    var quota=1;
    if(segVal("o_soc")==="socio"){
      quota=num(v("o_quota"))/100;
      if(!(quota>0&&quota<1))return showErr("o_err","La tua quota deve stare tra 1 e 99.");
    }
    var o={id:uid(),name:v("o_name").trim()||"Ordine",date:vd("o_d"),wallet:v("o_w"),
      total:tot,ship2:0,ship2paid:false,share:quota,items:items};
    S.orders.push(o);
    if(o.wallet!=="nessuno")
      post(o.wallet,-tot*quota,"Ordine "+o.name,"ordine","order:"+o.id,o.date);
    save();closeSheet();render();toast("Ordine registrato");
  });

function drawItems(){
  document.getElementById("o_items").innerHTML=draftItems.map(function(it,i){
    return '<div class="itemrow" style="margin-bottom:7px">'+
     '<input class="fi" data-i="'+i+'" data-f="n" placeholder="es. Pochette" value="'+esc(it.n)+'">'+
     '<input class="fi mono" data-i="'+i+'" data-f="q" inputmode="numeric" placeholder="Qtà" value="'+esc(it.q)+'">'+
     (draftItems.length>1?'<button class="mini" data-rm="'+i+'">−</button>':'<span></span>')+'</div>';
  }).join("");
  var box=document.getElementById("o_items");
  box.oninput=preview;
  box.onclick=function(e){
    var b=e.target.closest("[data-rm]");if(!b)return;
    readItems();draftItems.splice(parseInt(b.getAttribute("data-rm"),10),1);drawItems();preview();
  };
  preview();
}
function readItems(){
  var box=document.getElementById("o_items");if(!box)return;
  box.querySelectorAll("input").forEach(function(inp){
    var i=parseInt(inp.getAttribute("data-i"),10);
    if(draftItems[i])draftItems[i][inp.getAttribute("data-f")]=inp.value;
  });
}
function preview(){
  readItems();
  var pieces=draftItems.reduce(function(t,i){return t+num(i.q);},0);
  var tot=num(v("o_s1"));
  var el=document.getElementById("o_prev");if(!el)return;
  if(!pieces||!tot){el.textContent="Scrivi il totale e i pezzi per vedere quanto ti costa ognuno.";return;}
  var soc=(typeof segVal==="function"&&segVal("o_soc")==="socio");
  var q=soc?num(v("o_quota"))/100:1;
  el.innerHTML="<b>"+pieces+" pezzi</b> per <b>"+eur(tot)+"</b> → "+eur(tot/pieces)+" a pezzo."+
   (soc&&q>0&&q<1?"<br>La tua parte: <b>"+eur(tot*q)+"</b>. Il resto &egrave; del socio."
    :"<br>&Egrave; un costo provvisorio: quando paghi la spedizione per l\'Italia si aggiorna.");
}

   '<p class="err" id="e_err" hidden></p>'+
   '<button class="btn" id="e_go">Salva modifiche</button></div>';
  openSheet(h);
  bind("e_go",function(){
    for(var i=0;i<o.items.length;i++){
      var q=Math.round(num(v("e_q"+i))),sold=soldQty(o.id,o.items[i].id);
      if(q<sold)return showErr("e_err","«"+o.items[i].name+"»: hai già venduto "+sold+" pezzi, la quantità non può essere "+q+".");
      if(q<0)return showErr("e_err","Le quantità non possono essere negative.");
    }
    o.name=v("e_name").trim()||o.name;
    for(var j=0;j<o.items.length;j++){
      o.items[j].name=v("e_n"+j).trim()||o.items[j].name;
      o.items[j].qty=Math.round(num(v("e_q"+j)));
    }
    o.total=num(v("e_s1"));
    var eq=num(v("e_q"))/100;
    o.share=(eq>0&&eq<=1)?eq:1;
    var s2=v("e_s2").trim();
    if(s2===""){o.ship2=0;o.ship2paid=false;unpost("order2:"+o.id);}
    else{o.ship2=num(s2);o.ship2paid=true;}
    /* riscrivo le uscite collegate con gli importi nuovi */
    o.wallet=v("e_w");
    var w=o.wallet;
    unpost("order:"+o.id);
    if(w!=="nessuno")
      post(w,-oPaid(o)*oShare(o),"Ordine "+o.name,"ordine","order:"+o.id,o.date);
    unpost("order2:"+o.id);
    if(o.ship2paid){
      var w2=o.wallet2||w;
      if(w2!=="nessuno")
        post(w2,-num(o.ship2)*oShare(o),"Spedizione "+o.name,"spedizione","order2:"+o.id,o.ship2date||o.date);
    }
    save();closeSheet();render();toast("Ordine aggiornato");
  });
}

function sheetLedger(id){
  var e=null,i;
  for(i=0;i<S.ledger.length;i++)if(S.ledger[i].id===id)e=S.ledger[i];
  if(!e)return;
  var origine={ordine:"un ordine",spedizione:"la spedizione di un ordine",vendita:"una vendita",
    gioco:"il gioco"}[e.k];
  var testa='<h3>'+esc(e.l)+'</h3><p class="hint">'+dmy(e.d)+' · '+esc(e.w)+' · '+
    '<b class="'+(e.a<0?"neg":"pos")+'">'+eur(e.a,true)+'</b></p>';

  if(e.ref&&e.k!=="rata"&&e.k!=="giro"){
    openSheet(testa+'<div class="note">Questo movimento nasce da '+(origine||"un\'altra sezione")+
      ': per cambiarlo vai lì e modifica quello, così i conti restano collegati.</div>');
    return;
  }
  if(e.k==="giro"){
    openSheet(testa+'<div class="note">È un giro tra i tuoi portafogli: i soldi non sono usciti, si sono solo spostati.</div>'+
      '<div style="margin-top:14px"><button class="btn danger" data-delgiro="'+e.id+'">Elimina il giro</button></div>');
    return;
  }
  if(e.k==="rata"){
    openSheet(testa+'<div class="note">È una rata pagata. Se la elimini, l\'importo torna sul debito.</div>'+
      '<div style="margin-top:14px"><button class="btn danger" data-delrata="'+e.id+'">Elimina</button></div>');
    return;
  }

  var isOut=e.a<0;
  openSheet(testa.replace("<h3>","<h3>Modifica ")+
   '<div class="f">'+
    '<div><label class="fl">Tipo</label><div class="seg" id="m_t">'+
     '<button class="'+(isOut?"on":"")+'" data-s="out">Uscita</button>'+
     '<button class="'+(isOut?"":"on")+'" data-s="in">Entrata</button></div></div>'+
    '<div><label class="fl">Importo</label>'+
     '<input class="fi mono" id="m_a" inputmode="decimal" value="'+
       String(Math.abs(e.a).toFixed(2)).replace(".",",")+'"></div>'+
    '<div><label class="fl">Descrizione</label>'+
     '<input class="fi" id="m_l" value="'+esc(e.l)+'"></div>'+
    '<div class="f2"><div><label class="fl">Categoria</label><select class="fi" id="m_c">'+
     '<option value="">—</option>'+
     CATS.concat(CATS_IN).filter(function(c,j,a){return a.indexOf(c)===j;})
       .map(function(c){return '<option'+((e.c||"")===c?" selected":"")+'>'+c+'</option>';}).join("")+
     '</select></div>'+
     '<div><label class="fl">Portafoglio</label>'+walletSel("m_w",e.w)+'</div></div>'+
    '<div><label class="fl">Data</label><input class="fi" type="date" id="m_d" value="'+esc(e.d)+'"></div>'+
    '<p class="err" id="m_err" hidden></p>'+
    '<button class="btn" id="m_go">Salva</button>'+
    '<button class="btn danger" data-delled="'+e.id+'">Elimina</button>'+
   '</div>');
  segify("m_t");
  bind("m_go",function(){
    var a=num(v("m_a"));
    if(a<=0)return showErr("m_err","Metti un importo maggiore di zero.");
    var out=segVal("m_t")==="out";
    e.a=out?-a:a;
    e.l=v("m_l").trim()||e.l;
    e.c=v("m_c");
    e.w=v("m_w");
    e.d=v("m_d")||e.d;
    if(e.k!=="rettifica")e.k=out?"spesa":"entrata";
    save();closeSheet();render();toast("Movimento aggiornato");
  });
}

/* ---- codice di apertura ---- */
var UNLOCKED=false,pinBuf="";
function locked(){return !!S.pin&&!UNLOCKED;}
function drawPad(){
  var keys=["1","2","3","4","5","6","7","8","9","","0","←"];
  document.getElementById("pad").innerHTML=keys.map(function(k){
    if(k==="")return '<button class="blank" disabled></button>';
    if(k==="←")return '<button class="del" data-k="del">Canc</button>';
    return '<button data-k="'+k+'">'+k+'</button>';
  }).join("");
}
function drawDots(){
  var d=document.getElementById("dots").children;
  for(var i=0;i<4;i++)d[i].className=i<pinBuf.length?"f":"";
}
function showLock(){
  pinBuf="";drawPad();drawDots();
  document.getElementById("lockMsg").textContent="Inserisci il tuo codice";
  document.getElementById("lock").classList.add("on");
}
function hideLock(){document.getElementById("lock").classList.remove("on");}
function pinKey(k){
  var el=document.getElementById("lock");
  el.classList.remove("bad");
  if(k==="del"){pinBuf=pinBuf.slice(0,-1);drawDots();return;}
  if(pinBuf.length>=4)return;
  pinBuf+=k;drawDots();
  if(pinBuf.length===4){
    if(pinBuf===String(S.pin)){UNLOCKED=true;hideLock();render();}
    else{
      el.classList.add("bad");
      document.getElementById("lockMsg").textContent="Codice sbagliato, riprova";
      setTimeout(function(){pinBuf="";drawDots();},350);
    }
  }
}

var SHEETS={menu:sheetAdd,spesa:function(){sheetFlow("spesa");},entrata:function(){sheetFlow("entrata");},
  pin:sheetPin,giro:sheetGiro,order:sheetOrder,sale:function(){sheetSale();},promo:sheetPromo,
  play:function(){sheetPlay(false);},storico:function(){sheetPlay(true);},debt:sheetDebt};

document.addEventListener("click",function(e){
  var t=e.target;
  var tab=t.closest("[data-tab]");if(tab)return go(tab.getAttribute("data-tab"));
  var g=t.closest("[data-go]");if(g)return go(g.getAttribute("data-go"));
  var sh=t.closest("[data-sheet]");if(sh){var f=SHEETS[sh.getAttribute("data-sheet")];if(f)f();return;}
  var adj=t.closest("[data-adj]");if(adj)return sheetAdjust(adj.getAttribute("data-adj"));
  var ar=t.closest("[data-arrived]");
  if(ar){var oa=find(S.orders,ar.getAttribute("data-arrived"));
    if(oa){oa.arrived=true;oa.arrivedDate=today();save();closeSheet();render();toast("Ordine arrivato");}
    return;}
  var un=t.closest("[data-unarrived]");
  if(un){var ou=find(S.orders,un.getAttribute("data-unarrived"));
    if(ou){ou.arrived=false;ou.arrivedDate="";save();closeSheet();render();toast("Rimesso in transito");}
    return;}
  var oe=t.closest("[data-editorder]");
  if(oe){var oid2=oe.getAttribute("data-editorder");closeSheet();
    setTimeout(function(){sheetOrderEdit(oid2);},280);return;}
  var od=t.closest("[data-order]");if(od)return sheetOrderDetail(od.getAttribute("data-order"));
  var sl=t.closest("[data-sell]");if(sl){closeSheet();setTimeout(function(){sheetSale(sl.getAttribute("data-sell"));},280);return;}
  var pr=t.closest("[data-promo]");if(pr)return sheetPromoDetail(pr.getAttribute("data-promo"));
  var py=t.closest("[data-pay]");if(py)return sheetPay(py.getAttribute("data-pay"));

  var ms=t.closest("[data-mshift]");
  if(ms){STATM=addMonth(STATM,parseInt(ms.getAttribute("data-mshift"),10));render();return;}
  var lrow=t.closest("[data-led]");if(lrow)return sheetLedger(lrow.getAttribute("data-led"));
  if(t.id==="mclear"){MQ="";MCAT="";render();return;}
  var dled=t.closest("[data-delled]");
  if(dled){
    var lid=dled.getAttribute("data-delled");
    ask("Eliminare?","Il movimento sparisce e i saldi si ricalcolano.","Elimina",function(){
      S.ledger=S.ledger.filter(function(x){return x.id!==lid;});
      save();closeSheet();render();toast("Eliminato");
    });
    return;
  }
  var dgir=t.closest("[data-delgiro]");
  if(dgir){
    var gid=dgir.getAttribute("data-delgiro"),ge=null,gi;
    for(gi=0;gi<S.ledger.length;gi++)if(S.ledger[gi].id===gid)ge=S.ledger[gi];
    if(!ge)return;
    ask("Eliminare il giro?","Spariscono tutte e due le righe, l'uscita e l'entrata.","Elimina",function(){
      unpost(ge.ref);save();closeSheet();render();toast("Giro eliminato");
    });
    return;
  }
  var drat=t.closest("[data-delrata]");
  if(drat){
    var rid=drat.getAttribute("data-delrata"),re=null,ri;
    for(ri=0;ri<S.ledger.length;ri++)if(S.ledger[ri].id===rid)re=S.ledger[ri];
    if(!re)return;
    ask("Eliminare la rata?","L'importo torna sul debito e i soldi rientrano nel portafoglio.","Elimina",function(){
      var pr=String(re.ref||"").split(":"),d=find(S.debts,pr[1]);
      if(d)d.left=num(d.left)+num(pr[2]);
      S.ledger=S.ledger.filter(function(x){return x.id!==rid;});
      save();closeSheet();render();toast("Rata eliminata");
    });
    return;
  }
  var ds=t.closest("[data-del-sale]");
  if(ds){
    var sid=ds.getAttribute("data-del-sale");
    ask("Eliminare la vendita?","Il pezzo torna in magazzino e l'incasso viene tolto.","Elimina",function(){
      S.sales=S.sales.filter(function(x){return x.id!==sid;});unpost("sale:"+sid);
      save();render();toast("Vendita eliminata");
    });
    return;
  }
  var dp=t.closest("[data-del-play]");
  if(dp){
    var pid=dp.getAttribute("data-del-play");
    ask("Eliminare?","Questo movimento di gioco sparisce e il saldo si ricalcola.","Elimina",function(){
      S.play=S.play.filter(function(x){return x.id!==pid;});unpost("play:"+pid);
      save();render();toast("Eliminato");
    });
    return;
  }
  var dor=t.closest("[data-delorder]");
  if(dor){
    var oid=dor.getAttribute("data-delorder");
    var nsales=S.sales.filter(function(x){return x.oid===oid;}).length;
    ask("Eliminare l'ordine?",nsales?("Spariscono anche le "+nsales+" vendite collegate."):"Sparisce anche la spesa collegata.","Elimina",function(){
      S.sales.filter(function(x){return x.oid===oid;}).forEach(function(x){unpost("sale:"+x.id);});
      S.sales=S.sales.filter(function(x){return x.oid!==oid;});
      S.orders=S.orders.filter(function(o){return o.id!==oid;});
      unpost("order:"+oid);unpost("order2:"+oid);
      save();closeSheet();render();toast("Ordine eliminato");
    });
    return;
  }
  var dpr=t.closest("[data-delpromo]");
  if(dpr){
    var prid=dpr.getAttribute("data-delpromo");
    ask("Eliminare la promo?","La persona sparisce dall'elenco.","Elimina",function(){
      S.promos=S.promos.filter(function(x){return x.id!==prid;});
      save();closeSheet();render();toast("Promo eliminata");
    });
    return;
  }
  var dd=t.closest("[data-deldebt]");
  if(dd){
    var did=dd.getAttribute("data-deldebt");
    ask("Eliminare il debito?","Le rate gia pagate restano nei movimenti.","Elimina",function(){
      S.debts=S.debts.filter(function(x){return x.id!==did;});
      save();render();toast("Debito eliminato");
    });
    return;
  }

  if(t.id==="bkCopy"){
    var ta=document.getElementById("bkOut");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){
        S.bk=records();save();render();toast("Backup copiato: incollalo nelle Note");},
        function(){ta.select();toast("Tieni premuto sul testo e copia");});
    }else{ta.select();ta.setSelectionRange(0,999999);S.bk=records();save();toast("Tieni premuto sul testo e copia");}
    return;
  }
  if(t.id==="bkRestore"){
    var raw=document.getElementById("bkIn").value.trim();
    if(!raw)return toast("Incolla prima il backup");
    var d;
    try{d=JSON.parse(raw);}catch(err){return toast("Questo testo non e un backup valido");}
    if(!d||!Array.isArray(d.ledger))return toast("Questo testo non e un backup valido");
    ask("Ripristinare?","Tutti i dati di adesso vengono sostituiti da quelli del backup.","Ripristina",function(){
      S=d;for(var k in blank)if(!(k in S))S[k]=Array.isArray(blank[k])?[]:blank[k];
      save();go("home");toast("Dati ripristinati");
    });
    return;
  }
  if(t.id==="wipe"){
    ask("Cancellare tutto?","Sparisce ogni movimento, ordine, promo e debito. Non si torna indietro.","Cancella tutto",function(){
      S=JSON.parse(JSON.stringify(blank));save();go("home");toast("Tutto cancellato");
    });
    return;
  }
});
